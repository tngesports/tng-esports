<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNG eSPORTS | Live Leaderboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#f4f4f4;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1100px,94%);margin:auto;padding:28px 0 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}
.back{color:#f4f4f4;text-decoration:none;border:1px solid #444;padding:9px 13px;border-radius:7px}
h1{margin:0;font-size:clamp(28px,5vw,48px);letter-spacing:.04em}
.sub{opacity:.7;margin:8px 0 22px}
.live{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:12px;letter-spacing:.08em}
.dot{width:9px;height:9px;border-radius:50%;background:#ff3b30;box-shadow:0 0 12px #ff3b30}
.card{border:1px solid #292929;border-radius:14px;background:#101010;overflow:hidden;margin-top:18px}
.card-head{padding:16px 18px;border-bottom:1px solid #292929;display:flex;justify-content:space-between;gap:12px;align-items:center}
select{background:#171717;color:#fff;border:1px solid #444;border-radius:7px;padding:9px}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 14px;text-align:left;border-bottom:1px solid #202020}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;opacity:.65}
td{font-size:14px}
.rank{font-weight:900}
.points{font-weight:900}
.empty{padding:35px 18px;text-align:center;opacity:.65}
@media(max-width:650px){.top{align-items:flex-start}.card{overflow-x:auto}table{min-width:650px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="live"><span class="dot"></span> LIVE LEADERBOARD</div>
      <h1>TNG eSPORTS</h1>
      <div class="sub">Live scores • Match-wise results • Overall ranking</div>
    </div>
    <a class="back" href="index.html">← Home</a>
  </div>

  <div class="card">
    <div class="card-head">
      <strong>OVERALL LEADERBOARD</strong>
      <select id="matchFilter" aria-label="Match">
        <option value="overall">Overall</option>
        <option value="match1">Match 1</option>
        <option value="match2">Match 2</option>
        <option value="match3">Match 3</option>
      </select>
    </div>
    <table>
      <thead><tr><th>Rank</th><th>Player</th><th>FF ID</th><th>Kills</th><th>Placement</th><th>Total</th></tr></thead>
      <tbody id="leaderboardBody">
        <tr><td colspan="6" class="empty">Live scores will appear here when the admin publishes results.</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script>
// UI-ready page. Firebase live data can be connected to this table from the Admin Dashboard.
document.getElementById("matchFilter").addEventListener("change", function(){
  // Reserved for Firebase match filtering.
});
</script>
</body>
</html>
